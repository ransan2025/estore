  <style>
    :root {
      --color-primary: #9a22f6;
      /* Default: Purple */
      --color-secondary: #f96fdc;
    }

    .btn-gradient {
      background: linear-gradient(to right, var(--color-primary), var(--color-secondary));
    }

    .tab-btn.active,
    .report-toggle-btn.active {
      background: linear-gradient(to right, var(--color-primary), var(--color-secondary));
    }


    .tab-content.hidden,
    .sub-tab-content.hidden,
    .report-tab.hidden {
      display: none !important;
      visibility: hidden !important;
    }

    .tab-content.active,
    .sub-tab-content.active,
    .report-tab.active {
      display: block !important;
      visibility: visible !important;
    }

    .sub-tab-content.hidden,
    .tab-content.hidden,
    .report-tab.hidden {
      display: none !important;
      visibility: hidden !important;
    }

    .sub-tab-content.active,
    .tab-content.active,
    .report-tab.active {
      display: block !important;
      visibility: visible !important;
    }

    #salesTabs .tab-btn.active {
      background-color: #2563eb;
      color: white;
      font-weight: bold;
    }

    #salesTabs .tab-btn {
      border-radius: 30px;
      padding: 8px 16px;
    }

    .tab-btn {
      border-radius: 30px;
      padding: 8px 16px;
    }


    /* 📦 Modal Styling Fix */
    .modal {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      background: #fff;
      color: #000;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
    }

    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 🌈 Theme Gradient Background Modal */
    .glass-modal-gradient {
      background: linear-gradient(to right, #9a22f6, #f96fdc);
      color: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      animation: fadeIn 0.4s ease-in-out;
    }

    /* Inputs and selects inside */
    .glass-modal-gradient input,
    .glass-modal-gradient select {
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      font-weight: 500;
    }

    /* Buttons */
    .btn-gradient {
      background: linear-gradient(to right, #9a22f6, #f96fdc);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 18px rgba(154, 34, 246, 0.4);
    }

    .btn-gradient:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(249, 111, 220, 0.6);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.6);
      color: #000;
    }

    /* Fade in */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .sticky-header thead th {
      position: sticky;
      top: 0;
      background: #f9fafb;
      z-index: 10;
    }

    .freeze-column td:nth-child(2),
    .freeze-column th:nth-child(2) {
      position: sticky;
      left: 40px;
      /* adjust based on your first column width */
      background: #f0f0f0;
      z-index: 5;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fadeInUp {
      animation: fadeInUp 0.4s ease-out;
    }

    @media (max-width: 768px) {
      #salesTabs {
        display: none !important;
      }
    }
  </style>
